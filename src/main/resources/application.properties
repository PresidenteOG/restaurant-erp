# ==========================================
# CONFIGURACIÓN GENERAL
# ==========================================
spring.application.name=restaurantus-erp
server.port=8080
restaurantus.max_login_attempts_until_block=3
restaurantus.open_time=8 AM
restaurantus.close_time=11 PM
restaurantus.iva_percent=10
restaurantus.chat_secret_key=${RESTAURANTUS_CHAT_KEY}

# ==========================================
# MONGODB (solo para las traducciones i18n)
# ==========================================
# Todo por variable de entorno. Por defecto, un Mongo local.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/restaurantus}

# ==========================================
# MYSQL (BASE DE DATOS PRINCIPAL)
# ==========================================
# 'jdbc-url' (no 'url') porque HikariCP lo requiere con @ConfigurationProperties manual.
# Sin credenciales en el repo: todo viene del entorno, con un MySQL local por defecto.
spring.datasource.jdbc-url=${DB_URL:jdbc:mysql://localhost:3306/restaurantus?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Mantiene los nombres de tablas/columnas tal cual están en Java (sin convertirlos a snake_case)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true

# ==========================================
# OPTIMIZACIONES DE CONEXIÓN (HIKARI CP)
# ==========================================
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# TELEGRAM BOT
# ==========================================
telegram.bot.token=${TELEGRAM_TOKEN_ENV}
#telegram.bot.username=Restaurantus_Bot

# ==========================================
# SUBIDA DE ARCHIVOS (MULTIPART)
# ==========================================
server.tomcat.max-parameter-count=2000
server.tomcat.max-file-count=10000
server.tomcat.max-http-form-post-size=20MB

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.resolve-lazily=true

# ==========================================
# SESIÓN Y DEVTOOLS
# ==========================================
server.servlet.session.timeout=15m
server.servlet.session.cookie.max-age=-1

# Evitar reinicios al modificar recursos estáticos
spring.devtools.restart.exclude=static/**,public/**,**/*.jpg,**/*.png,**/*.webp,**/*.jpeg