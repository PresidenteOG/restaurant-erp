# ==========================================
# PERFIL DEMO  ·  activar con SPRING_PROFILES_ACTIVE=demo
# ==========================================
# Objetivo: arrancar la aplicacion completa SIN servicios externos.
#   - MySQL  -> H2 en memoria (esquema desde las entidades, sin Flyway)
#   - MongoDB (i18n) -> no se usa; los textos salen de classpath:messages.properties
#   - Telegram -> apagado (telegram.enabled=false)
# Datos de ejemplo: DemoDataSeeder (CommandLineRunner @Profile("demo")).

# ---- Base de datos principal: H2 en memoria, dialecto MySQL ----
spring.datasource.jdbc-url=jdbc:h2:mem:restaurantus;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---- MongoDB: no se usa en demo. Apuntamos a localhost con timeouts cortos:
#      la conexion se rechaza al instante, LangServiceImpl captura el fallo y
#      todo el i18n se resuelve desde classpath:messages.properties ----
spring.data.mongodb.uri=mongodb://127.0.0.1:27017/restaurantus?serverSelectionTimeoutMS=600&connectTimeoutMS=600&socketTimeoutMS=600
spring.data.mongodb.auto-index-creation=false

# ---- Telegram apagado: sin bot, sin interceptor de vinculacion ----
telegram.enabled=false
telegram.bot.token=disabled

# ---- Clave AES del chat interno (16 chars, solo demo) ----
restaurantus.chat_secret_key=RestaurantusDemo

# La demo gratuita de Render se duerme tras ~15 min de inactividad;
# el primer acceso despues de dormir tarda ~30-50 s en responder.
