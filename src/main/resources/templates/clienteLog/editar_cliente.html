<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{customer.edit.title_page}">Editar Cliente - Restaurantus</title>
    <link rel="icon" href="/images/favicon.png"> 

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <style>
        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 900px;
            margin: 20px 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
            font-size: 0.95rem;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: #2ecc71;
            box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.1);
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .flex-2 {
            flex: 2;
        }

        .flex-1 {
            flex: 1;
        }

        .btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
        }

        .btn-update {
            background-color: #2ecc71;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-update:hover {
            background-color: #27ae60;
            transform: translateY(-1px);
        }

        .btn-cancel {
            background-color: #f8fafc;
            color: #64748b;
            padding: 12px 25px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-cancel:hover {
            background-color: #f1f5f9;
            color: #334155;
        }

        /* Estilos para las alertas */
        .alert-custom {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            max-width: 900px;
            animation: fadeIn 0.5s ease;
        }

        .alert-success {
            background-color: #ecfdf5;
            border-left: 5px solid #10b981;
            color: #065f46;
        }

        .alert-error {
            background-color: #fee2e2;
            border-left: 5px solid #ef4444;
            color: #991b1b;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div th:replace="~{/page_dashboard/dashboard :: sidebar(activePage='customers')}"></div>

    <div class="admin-container">
        <main class="main-content with-dashboard">

            <div class="panel-header">
                <h1>
                    <i class="bi bi-pencil-square" style="color: #2ecc71; margin-right: 12px;"></i>
                    <span th:text="#{customer.edit.h1}">Editar Cliente</span>
                </h1>
                <p th:text="#{customer.edit.subtitle}">Actualiza la información personal y preferencias del cliente.</p>
            </div>

            <div th:if="${success}" id="msg-alert" class="alert-custom alert-success msg-alert">
                <i class="bi bi-check-circle-fill" style="font-size: 1.2rem;"></i>
                <span th:text="${success}"></span>
            </div>

            <div th:if="${error}" id="msg-alert" class="alert-custom alert-error msg-alert">
                <i class="bi bi-exclamation-triangle-fill" style="font-size: 1.2rem;"></i>
                <span th:text="${error}"></span>
            </div>

            <div class="form-container">
                <form th:action="@{/clientes/actualizar}" th:object="${cliente}" method="post">

                    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <input type="hidden" th:field="*{idClienteLog}" />

                    <div class="form-row">
                        <div class="form-group flex-2">
                            <label for="nombreCliente"><i class="bi bi-person-badge"></i> <span
                                    th:text="#{customer.form.name}">Nombre Completo</span></label>
                            <input type="text" id="nombreCliente" th:field="*{nombreCliente}" class="form-control"
                                placeholder="Ej. Juan Pérez" required>
                        </div>

                        <div class="form-group flex-1">
                            <label for="telefono"><i class="bi bi-telephone"></i> <span
                                    th:text="#{customer.form.phone}">Teléfono</span></label>
                            <input type="text" id="telefono" th:field="*{telefono}" class="form-control"
                                placeholder="+34 123456789">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email"><i class="bi bi-envelope"></i> <span th:text="#{customer.form.email}">Correo
                                Electrónico</span></label>
                        <input type="email" id="email" th:field="*{email}" class="form-control"
                            placeholder="correo@ejemplo.com">
                    </div>

                    <div class="form-group">
                        <label for="notasCliente"><i class="bi bi-journal-text"></i> <span
                                th:text="#{customer.form.notes}">Notas, Alergias o Preferencias</span></label>
                        <textarea id="notasCliente" th:field="*{notasCliente}" class="form-control" rows="5"
                            th:placeholder="#{customer.form.placeholder_notes}"></textarea>
                    </div>

                    <div class="btn-group">
                        <a th:href="@{/clientes/listar}" class="btn-cancel" th:text="#{crudCommons.cancel}">Volver al
                            listado</a>
                        <button type="submit" class="btn-update">
                            <i class="bi bi-save"></i> <span th:text="#{customer.form.btn_update}">Guardar
                                Cambios</span>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        window.onload = function () {
            // Seleccionamos todos los elementos que tengan la clase alert-custom
            const alerts = document.querySelectorAll('.alert-custom');
            alerts.forEach(alertElement => {
                setTimeout(() => {
                    alertElement.style.transition = "opacity 0.6s ease";
                    alertElement.style.opacity = "0";
                    setTimeout(() => alertElement.remove(), 600);
                }, 5000);
            });
        };

        // Formateo dinámico del campo de teléfono
        const inputTelefono = document.getElementById('telefono');
        inputTelefono.addEventListener('input', function (e) {
            let value = e.target.value;

            // 1. Asegurar que empiece con +
            if (value.length > 0 && !value.startsWith('+')) {
                value = '+' + value;
            }

            // 2. Lógica de guiones: Solo si el usuario está escribiendo (no borrando)
            // Aplicamos el guion en las posiciones 7 y 11 del string "+XX 123-456-789"
            if (e.inputType !== 'deleteContentBackward') {
                if (value.length === 3) {
                    value += ' ';
                } else {

                    if (value.length === 7 || value.length === 11) {
                        value += '-';
                    }
                }
            }

            // 3. Limitar longitud final (+34 123-456-789 tiene 15 caracteres)
            if (value.length > 15) {
                value = value.slice(0, 15);
            }

            e.target.value = value;
        });
    </script>
</body>

</html>
