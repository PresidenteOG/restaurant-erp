<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{customer.new.title_page}">Nuevo Cliente - Restaurantus</title>
    <link rel="icon" href="/images/favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <style>
        /* Banner de éxito añadido */
        .alert-success-custom {
            background-color: #d1fae5;
            border-left: 5px solid #2ecc71;
            color: #065f46;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(46, 204, 113, 0.1);
            max-width: 900px;
            animation: fadeInDown 0.4s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 900px;
            margin: 20px 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
            font-size: 0.95rem;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: #2ecc71;
            box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.1);
            background-color: #fff;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .flex-2 {
            flex: 2;
        }

        .flex-1 {
            flex: 1;
        }

        /* Botones */
        .btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
        }

        .btn-submit {
            background-color: #2ecc71;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background-color: #27ae60;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.2);
        }

        .btn-cancel {
            background-color: #f8fafc;
            color: #64748b;
            padding: 12px 25px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-cancel:hover {
            background-color: #f1f5f9;
            color: #334155;
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }

        /* Estilo para el banner de error */
        .alert-error-custom {
            background-color: #fee2e2;
            border-left: 5px solid #ef4444;
            color: #991b1b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.1);
            animation: fadeInDown 0.4s ease-out;
            max-width: 900px;
            width: 100%;
        }
    </style>
</head>

<body>
    <div th:replace="~{/page_dashboard/dashboard :: sidebar(activePage='customers')}"></div>

    <div class="admin-container">
        <main class="main-content with-dashboard">

            <div class="panel-header">
                <h1>
                    <i class="bi bi-person-plus-fill" style="color: #2ecc71; margin-right: 12px;"></i>
                    <span th:text="#{customer.new.h1}">Registrar Nuevo Cliente</span>
                </h1>
                <p th:text="#{customer.new.subtitle}">Añade un nuevo cliente a la base de datos para gestionar sus
                    reservas y contacto.</p>
            </div>

            <div th:if="${success}" class="alert-success-custom msg-alert">
                <i class="bi bi-check-circle-fill" style="font-size: 1.4rem;"></i>
                <span th:text="${success}"></span>
            </div>

            <div th:if="${error}" class="alert-error-custom msg-alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${error}"></span>
            </div>

            <div class="form-container">
                <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">

                    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="form-row">
                        <div class="form-group flex-2">
                            <label for="nombreCliente"><i class="bi bi-person-badge"></i> <span
                                    th:text="#{customer.form.name}+ ' *'">Nombre Completo</span></label>
                            <input type="text" id="nombreCliente" th:field="*{nombreCliente}" class="form-control"
                                placeholder="Ej: Maria García" required>
                        </div>

                        <div class="form-group flex-1">
                            <label for="telefono"><i class="bi bi-telephone"></i> <span
                                    th:text="#{customer.form.phone}">Teléfono</span></label>
                            <input type="text" id="telefono" th:field="*{telefono}" class="form-control"
                                placeholder="+34 123456789">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email"><i class="bi bi-envelope"></i> <span th:text="#{customer.form.email}">Correo
                                Electrónico</span></label>
                        <input type="email" id="email" th:field="*{email}" class="form-control"
                            placeholder="ejemplo@restaurantus.com">
                    </div>

                    <div class="form-group">
                        <label for="notasCliente"><i class="bi bi-journal-text"></i> <span
                                th:text="#{customer.form.notes}">Notas, Alergias o Preferencias</span></label>
                        <textarea id="notasCliente" th:field="*{notasCliente}" class="form-control" rows="5"
                            th:placeholder="#{customer.form.placeholder_notes}"></textarea>
                    </div>

                    <div class="btn-group">
                        <a th:href="@{/clientes/listar}" class="btn-cancel" th:text="#{customer.form.btn_cancel}">Volver
                            al Listado</a>
                        <button type="submit" class="btn-submit">
                            <i class="bi bi-check-lg"></i> <span th:text="#{customer.form.btn_save}">Guardar
                                Cliente</span>
                        </button>
                    </div>
                </form>
            </div>



            <script>
                window.onload = function () {
                    const alerts = document.querySelectorAll('.msg-alert');
                    alerts.forEach(alertElement => {
                        setTimeout(() => {
                            alertElement.style.transition = "opacity 0.4s ease";
                            alertElement.style.opacity = "0";
                            setTimeout(() => alertElement.remove(), 600);
                        }, 5000);
                    });
                };

                // Formateo dinámico del campo de teléfono
                const inputTelefono = document.getElementById('telefono');
                inputTelefono.addEventListener('input', function (e) {
                    let value = e.target.value;

                    // 1. Asegurar que empiece con +
                    if (value.length > 0 && !value.startsWith('+')) {
                        value = '+' + value;
                    }

                    // 2. Lógica de guiones: Solo si el usuario está escribiendo (no borrando)
                    // Aplicamos el guion en las posiciones 7 y 11 del string "+XX 123-456-789"
                    if (e.inputType !== 'deleteContentBackward') {
                        if (value.length === 3) {
                            value += ' ';
                        } else {

                            if (value.length === 7 || value.length === 11) {
                                value += '-';
                            }
                        }
                    }

                    // 3. Limitar longitud final (+34 123-456-789 tiene 15 caracteres)
                    if (value.length > 15) {
                        value = value.slice(0, 15);
                    }

                    e.target.value = value;
                });
            </script>
        </main>
    </div>
</body>

</html>
