<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{error.403.title_page}">403 - Acceso Restringido | Restaurantus</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        /* Contenedor principal para sidebar + contenido */
        .admin-container {
            display: flex;
            min-height: 100vh;
        }

        /* FONJO ROJO DE ALERTA SOLO AQUÍ */
        .main-content.with-dashboard {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fdeaea;
            /* Un rojo claro y limpio */
            padding: 20px;
        }

        .error-image {  
            width: 100%;
            max-width: 350px;
            height: auto;
            margin-bottom: 20px;
            /* Filtro opcional para dar tono de aviso */
            filter: drop-shadow(0px 10px 15px rgba(220, 53, 69, 0.2));
        }

        /* TARJETA BLANCA SIN TRANSFORM Y SIN SOMBRAS ROJAS */
        .error-card {
            max-width: 550px;
            text-align: center;
        }

        .lock-icon {
            font-size: 70px;
            color: #dc3545;
            margin-bottom: 10px;
        }

        .error-code {
            font-size: 85px;
            font-weight: 800;
            color: #dc3545;
            line-height: 1;
        }

        .user-badge {
            display: inline-block;
            background: #f8f9fa;
            padding: 8px 18px;
            border-radius: 4px;
            color: #212529;
            font-weight: 600;
            margin: 20px 0;
            border: 1px solid #dee2e6;
        }

        /* Botones sin efectos de movimiento */
        .btn-custom {
            border-radius: 8px;
            font-weight: 600;
            padding: 10px 20px;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <main class="main-content with-dashboard">
            <div class="error-card">

                <img th:src="@{/images/error/403.png}" alt="Error 403" title="Error 403" class="error-image">
                <h2 class="fw-bold text-dark mt-2" th:text="#{error.403.title}">Acceso Restringido</h2>

                <div class="user-badge" sec:authorize="isAuthenticated()">
                    <i class="bi bi-person-circle me-1"></i>
                    <span th:text="#{error.403.user_label} + ' '"></span>
                    <span th:text="${#authentication.name}">Nombre</span>
                </div>

                <p class="text-muted mb-4" th:text="#{error.403.message}">
                    No tienes los permisos necesarios para entrar aquí.
                    Por favor, regresa al inicio o cambia de cuenta.
                </p>

                <div class="d-grid gap-2 d-md-flex justify-content-md-center">

                    <a th:href="@{/home}" class="btn btn-success btn-custom">
                        <i class="bi bi-house-door me-2"></i>
                        <span th:text="#{error.403.btn_home}">Ir al Inicio</span>
                    </a>

                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-danger btn-custom">
                            <i class="bi bi-person-badge me-2"></i>
                            <span th:text="#{error.403.btn_logout}">Cambiar Usuario</span>
                        </button>
                    </form>

                    <a href="javascript:history.back()" class="btn btn-outline-secondary btn-custom">
                        <i class="bi bi-arrow-left me-2"></i>
                        <span th:text="#{error.403.btn_back}">Volver</span>
                    </a>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
