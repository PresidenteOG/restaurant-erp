<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{error.404.title_page}">405 - Método No Permitido | Restaurantus</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        .admin-container {
            display: flex;
            min-height: 100vh;
        }

        .main-content.with-dashboard {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f3ff; /* Fondo púrpura muy suave */
            padding: 20px;
        }

        .error-content-simple {  
            max-width: 550px;
            text-align: center;
            background: transparent;
        }

        .error-image {
            width: 100%;
            max-width: 350px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0px 10px 15px rgba(109, 40, 217, 0.2));
        }

        .info-box-simple {
            display: inline-block;
            padding: 10px 20px;
            color: #5b21b6; /* Púrpura oscuro profesional */
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .btn-custom {
            border-radius: 8px;
            font-weight: 600;
            padding: 10px 25px;
        }

        .error-details {
            font-size: 0.85rem;
            background: #ffffff;
            border: 1px solid #ddd6fe;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <main class="main-content with-dashboard">
            
            <div class="error-content-simple">
                <img th:src="@{/images/error/405.png}" alt="Error 405" class="error-image"> 
                 
                <h2 class="fw-bold text-dark" th:text="#{error.405.title}">Comanda no válida</h2>

                <div class="info-box-simple" th:text="#{error.405.info_box}">
                    ¡Este método no está en la receta! (Error 405)
                </div>

                <p class="text-muted mb-4" th:text="#{error.405.message}">
                    Estás intentando realizar una acción que nuestro sistema no permite para esta página. 
                    Es como intentar comer sopa con un tenedor.
                </p>

                <div class="d-flex gap-3 justify-content-center mb-4">
                    <a th:href="@{/home}" class="btn btn-primary btn-custom shadow-sm text-white" style="background-color: #6d28d9; border: none;">
                        <i class="bi bi-house-door me-2"></i>
                        <span th:text="#{error.405.btn_home}">Ir al Inicio</span>
                    </a>

                    <a href="javascript:history.back()" class="btn btn-outline-primary btn-custom bg-white" style="color: #6d28d9; border-color: #6d28d9;">
                        <i class="bi bi-arrow-left me-2"></i>
                        <span th:text="#{error.405.btn_back}">Volver atrás</span>
                    </a>
                </div>

                <div th:if="${message}" class="error-details mt-3">
                    <strong th:text="#{error.405.system_msg}">Información del sistema:</strong>
                    <code th:text="${message}">Método HTTP no soportado</code>
                </div>
            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
