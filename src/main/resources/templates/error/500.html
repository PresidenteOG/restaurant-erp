<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{error.500.title_page}">500 - Error Interno | Restaurantus</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        .admin-container {
            display: flex;
            min-height: 100vh;
        }

        .main-content.with-dashboard {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff5f5; /* Fondo rojizo muy suave para indicar error */
            padding: 20px;
        }

        .error-content-simple {  
            max-width: 550px;
            text-align: center;
            background: transparent;
        }

        .error-image {
            width: 100%;
            max-width: 350px;
            height: auto;
            margin-bottom: 20px;
            /* Filtro opcional para dar tono de aviso */
            filter: drop-shadow(0px 10px 15px rgba(220, 53, 69, 0.2));
        }

        .info-box-simple {
            display: inline-block;
            padding: 10px 20px;
            color: #c53030; /* Rojo oscuro profesional */
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .btn-custom {
            border-radius: 8px;
            font-weight: 600;
            padding: 10px 25px;
        }

        .error-details {
            font-size: 0.85rem;
    background: #ffffff;
    border: 1px solid #feb2b2;
    border-radius: 8px;
    padding: 15px;
    text-align: left;
    max-height: 200px;
    overflow-y: auto;
    display: block; /* CAMBIAR DE none A block */
    margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <main class="main-content with-dashboard">
            
            <div class="error-content-simple">
                <img th:src="@{/images/error/500.png}" alt="Error 500" title="Error 500" class="error-image"> 
                 
                <h2 class="fw-bold text-dark" th:text="#{error.500.title}">Error en los fogones</h2>

                <div class="info-box-simple" th:text="#{error.500.info_box}">
                    ¡Se nos ha quemado el pedido! (Error 500)
                </div>

                <p class="text-muted mb-4" th:text="#{error.500.message}">
                    Algo ha salido mal en nuestro servidor mientras preparábamos la página. 
                    Nuestro equipo técnico ya ha sido notificado.
                </p>

                <div class="d-flex gap-3 justify-content-center mb-4">
                    <a th:href="@{/home}" class="btn btn-danger btn-custom shadow-sm text-white">
                        <i class="bi bi-house-door me-2"></i>
                        <span th:text="#{error.500.btn_home}">Ir al Inicio</span>
                    </a>

                    <a href="javascript:location.reload()" class="btn btn-outline-danger btn-custom bg-white">
                        <i class="bi bi-arrow-clockwise me-2"></i>
                        <span th:text="#{error.500.btn_retry}">Reintentar</span>
                    </a>
                </div>

                <div th:if="${message}" class="error-details mt-3" id="details">
                    <strong th:text="${#error.500.tech_msg}">Mensaje técnico:</strong>
                    <code th:text="${message}">Error description</code>
                </div>
            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
