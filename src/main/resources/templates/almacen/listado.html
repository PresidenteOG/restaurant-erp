<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{inventory.list.title_page}">Listado ingredientes - Restaurantus</title>
    <link rel="stylesheet" href="/css/user_and_roles_lists.css">
    <link rel="icon" href="/images/favicon.png">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
    <div th:replace="~{/page_dashboard/dashboard :: sidebar(activePage='inventory')}"></div>

    <div class="admin-container">
        <main class="main-content with-dashboard">
            <div class="panel-header" style="margin-bottom: 20px;">
                <h1 th:text="#{inventory.list.h1}">Inventario de Almacén</h1>
                <p th:text="#{inventory.list.subtitle}">Control de existencias y unidades de medida para cocina.</p>
                <div style="margin-top: 20px;">
                    <a th:href="@{/almacen/nuevo}" sec:authorize="hasAnyRole('GESTOR_ALMACEN', 'ADMIN', 'GERENTE')"
                        class="btn-action btn-primary"
                        style="text-decoration:none; display: inline-block; width: auto; padding: 10px 20px;"
                        th:text="'+ ' + #{inventory.list.btn_new}">+ Añadir Ingrediente</a>
                    <a th:href="@{/almacen/stock}" class="btn-action btn-primary"
                        style="text-decoration:none; display: inline-block; width: auto; padding: 10px 20px; background-color: rgb(0, 195, 188);"
                        th:text="#{inventory.list.btn_stock}">Gestionar Solicitud Stock</a>
                    <a th:href="@{/almacen/consumos}" class="btn-action btn-primary"
                        style="text-decoration:none; display: inline-block; width: auto; padding: 10px 20px;"
                        th:text="#{inventory.list.btn_consumptions}">Historial de Consumos</a>
                </div>
            </div>
            <div style="background-color: white; padding: 20px; border-radius: 8px; margin-top: 20px;">
                <table id="tablaIngredientes" class="data-table">
                    <thead>
                        <tr>
                            <th th:text="#{inventory.list.th_name}">Ingrediente</th>
                            <th th:text="#{inventory.list.th_stock}">Stock Actual</th>
                            <th th:text="#{inventory.consumptions.th_unit}">Unidad</th>
                            <th th:text="#{inventory.list.th_status}">Estado</th>
                            <th th:text="#{inventory.list.th_location}">Ubicación</th>
                            <th th:text="#{inventory.list.th_price}">Precio Unitario</th>
                            <th th:text="#{crudCommons.actions}" class="text-center no-sort"
                            sec:authorize="hasAnyRole('GESTOR_CLIENTES', 'ADMIN', 'GERENTE')">Acciones</th>
                        </tr>
                        <tr class="filter-row">
                            <th><input type="text" th:placeholder="#{inventory.list.th_name} + '...'"></th>
                            <th><input type="text" th:placeholder="#{inventory.list.th_stock} + '...'"></th>
                            <th>
                                <select class="select-filter">
                                    <option value="" th:text="#{crudCommons.all}">Todos</option>
                                    <option th:value="#{inventory.list.unit_l}" th:text="#{inventory.list.unit_l}">Litros (L)</option>
                                    <option th:value="#{inventory.list.unit_kg}" th:text="#{inventory.list.unit_kg}">Kilogramos (KG)</option>
                                    <option th:value="#{inventory.list.unit_g}" th:text="#{inventory.list.unit_g}">Gramos (G)</option>
                                    <option th:value="#{inventory.list.unit_units}" th:text="#{inventory.list.unit_units}">Unidades</option>
                                </select>
                            </th>
                            <th>
                                <select class="select-filter">
                                    <option value="" th:text="#{crudCommons.all}">Todos</option>
                                    <option th:value="#{inventory.list.status_ok}" th:text="#{inventory.list.status_ok}">Stock OK</option>
                                    <option th:value="#{inventory.list.status_low}" th:text="#{inventory.list.status_low}">Stock Bajo</option>
                                </select>
                            </th>
                            <th><input type="text" th:placeholder="#{inventory.list.th_location} + '...'"></th>
                            <th><input type="text" th:placeholder="#{inventory.list.th_price} + '...'"></th>
                            <th sec:authorize="hasAnyRole('GESTOR_CLIENTES', 'ADMIN', 'GERENTE')"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ing : ${ingredientes}">
                            <td>
                                <span th:text="${ing.nombre}" style="font-weight: bold;"></span>
                                <br>
                                <a th:href="@{/almacen/lotes/{id}(id=${ing.id})}" style="color: #0d92e4;"
                                class="edit-link" th:text="#{inventory.list.see_lots}">Ver Lotes</a>
                            </td>
                            <td th:text="${ing.unidadMedida} == 'UNIDADES' ? ${#numbers.formatDecimal(ing.stockActual, 0, 0)} : ${ing.stockActual}"></td>
                            <td th:text="${ing.unidadMedida == 'L' ? #messages.msg('inventory.list.unit_l')
                                : ing.unidadMedida == 'KG' ? #messages.msg('inventory.list.unit_kg')
                                : ing.unidadMedida == 'G' ? #messages.msg('inventory.list.unit_g')
                                : #messages.msg('inventory.list.unit_units')}"></td>
                            <td>
                                <span
                                    th:class="${ing.stockActual > 5} ? 'status-pill status-active' : 'status-pill status-inactive'"
                                    th:text="${ing.stockActual > 5} ? #{inventory.list.status_ok} : #{inventory.list.status_low}">
                                </span>
                            </td>
                            <td th:text="${ing.ubicacion}"></td>
                            <td th:text="${#numbers.formatDecimal(ing.precioUnitario, 1, 2) + '€'}"></td>
                            <td sec:authorize="hasAnyRole('GESTOR_ALMACEN', 'ADMIN', 'GERENTE')">
                                <a th:href="@{/almacen/editar/{id}(id=${ing.id})}" class="edit-link" th:text="#{crudCommons.edit}">Editar</a>
                                <span style="color: #475569;"></span>
                                <a th:href="@{/almacen/eliminar/{id}(id=${ing.id})}" class="edit-link"
                                    style="color: #ef4444;" th:text="#{crudCommons.delete}"
                                    onclick="return confirm('¿Seguro que quieres eliminar este ingrediente?')">Eliminar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div style="margin-top: 20px;">
                <a th:href="@{/almacen/inventario/informePdf}" class="btn-action" 
                style="text-decoration:none; display: inline-block; width: auto; padding: 10px 20px; background-color: #f59e0b; color: white;"
                th:text="'📄 ' + #{inventory.list.btn_pdf}">📄 Descargar Informe PDF</a>
            </div>
        </main>
    </div>

    <script th:inline="javascript">
        window.datatableTranslations = {
            search: "",
            searchPlaceholder: /*[[#{crudCommons.search}]]*/ "Buscar",
            lengthMenu: /*[[#{crudCommons.lengthMenu}]]*/ "Mostrar _MENU_ registros",
            infoFiltered: "",
            info: /*[[#{crudCommons.info}]]*/ "Mostrando _START_ a _END_ de <b>_TOTAL_</b> registros",
            infoEmpty: /*[[#{crudCommons.infoEmpty}]]*/ "Mostrando 0 a 0 de 0 registros",
            paginate: {
                next: /*[[#{crudCommons.next}]]*/ "Siguiente",
                previous: /*[[#{crudCommons.previous}]]*/ "Anterior",
                first: /*[[#{crudCommons.first}]]*/ "Primero",
                last: /*[[#{crudCommons.last}]]*/ "Último"
            }
        };
    </script>
</body>

</html>
