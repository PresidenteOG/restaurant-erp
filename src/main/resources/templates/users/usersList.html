<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{manageUsers.subtitle}">Manage Users - Restaurantus</title>
    <link rel="stylesheet" href="/css/user_and_roles_lists.css">
    <link rel="icon" href="/images/favicon.png">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
    <div th:replace="~{/page_dashboard/dashboard :: sidebar(activePage='rolesAndUsers')}"></div>

    <div class="admin-container">
        <main class="main-content with-dashboard">
            <div class="panel-header"
                style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1 th:text="#{manageUsers.title}">Gestión de usuarios</h1>
                    <p th:text="#{manageUsers.subtitle}">Gestiona usuarios, trabajadores, y accesos al sistema.</p>
                </div>
                <div>
                    <a th:href="@{/users/register-new}" class="btn-action btn-primary"
                        style="text-decoration:none; display: inline-block; width: auto; padding: 10px 25px; background-color: #2ecc71; border: none; border-radius: 8px; font-weight: 600; color: white;">
                        <i class="bi bi-person-plus-fill"></i><text th:text="' ' + #{manageUsers.addUser}">Nuevo Usuario</text>
                    </a>
                </div>
            </div>

            <div class="nav-tabs" style="--bs-nav-tabs-border-color: #ffffff00;">
                <a th:text="#{manageUsers.tab_users}" class="tab-btn active">Usuarios</a>
                <a th:text="#{manageUsers.tab_roles}" th:href="@{/roles}" class="tab-btn">Roles</a>
                <a th:text="#{manageUsers.tab_logins}" th:href="@{/loginAttempts}" class="tab-btn">Intentos de Login</a>
            </div>

            <div style="background-color: white; padding: 20px; border-radius: 8px; margin-top: 20px;">
                <table id="tablaUsuarios" class="data-table">
                    <thead>
                        <tr>
                            <th class="no-sort" th:text="#{manageUsers.image}">Imagen</th>
                            <th th:text="#{crudCommons.name}">Nombre</th>
                            <th th:text="#{manageUsers.roles}">Roles</th>
                            <th th:text="#{manageUsers.email}">Email</th>
                            <th th:text="#{crudCommons.status}">Estado</th>
                            <th class="text-center no-sort" th:text="#{crudCommons.actions}">Actions</th>
                        </tr>
                        <tr class="filter-row">
                            <th></th>
                            <th><input type="text" th:placeholder="#{crudCommons.searchByName}"></th>
                            <th><input type="text" th:placeholder="#{manageUsers.searchByRole}"></th>
                            <th><input type="text" th:placeholder="#{manageUsers.searchByEmail}"></th>
                            <th>
                                <!-- <input type="text" placeholder="Estado"> -->
                                <select class="select-filter">
                                    <option value="" th:text="#{crudCommons.all}">Todos</option>
                                    <option th:value="#{crudCommons.status_enabled}" th:text="#{crudCommons.status_enabled}">Activos</option>
                                    <option th:value="#{crudCommons.status_disabled}" th:text="#{crudCommons.status_disabled}">Inactivos</option>
                                </select>
                            </th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td style="width: 50px; text-align: center;">
                                <div class="user-table-avatar">
                                    <img th:src="${user.foto != null} ? @{'/images/profiles/' + ${user.foto}} : @{/images/profiles/default-profile.png}" alt="Profile"
                                        style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid #e2e8f0;">
                                </div>
                            </td>
                            <td>
                                <span th:text="${user.username}"></span>
                            </td>
                            <td>
                                <div th:each="role : ${user.roles}" th:if="${role.isActive}">
                                    <text th:text="${role.name}" />
                                </div>
                            </td>
                            <td th:text="${user.email}"></td>
                            <td><span
                                    th:class="${user.enabled} ? 'status-pill status-active' : 'status-pill status-inactive'"
                                    th:text="${user.enabled} ? #{crudCommons.status_enabled} : #{crudCommons.status_disabled}">Status</span>
                            </td>
                            <td>
                                <div style="display: flex; gap: 20px;">
                                    <a th:href="@{'/users/edit-' + ${user.id}}" th:text="#{crudCommons.edit}"
                                        class="edit-link">Edit</a>
                                    <a th:if="${user.username} != 'admin'" th:href="@{'/users/delete-' + ${user.id}}"
                                        th:text="#{crudCommons.delete}" class="delete-link">Delete</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script th:inline="javascript">
        window.datatableTranslations = {
            search: "",
            searchPlaceholder: /*[[#{crudCommons.search}]]*/ "Buscar",
            lengthMenu: /*[[#{crudCommons.lengthMenu}]]*/ "Mostrar _MENU_ registros",
            infoFiltered: "",
            info: /*[[#{crudCommons.info}]]*/ "Mostrando _START_ a _END_ de <b>_TOTAL_</b> registros",
            infoEmpty: /*[[#{crudCommons.infoEmpty}]]*/ "Mostrando 0 a 0 de 0 registros",
            paginate: {
                next: /*[[#{crudCommons.next}]]*/ "Siguiente",
                previous: /*[[#{crudCommons.previous}]]*/ "Anterior",
                first: /*[[#{crudCommons.first}]]*/ "Primero",
                last: /*[[#{crudCommons.last}]]*/ "Último"
            }
        };
    </script>
</body>
</html>
