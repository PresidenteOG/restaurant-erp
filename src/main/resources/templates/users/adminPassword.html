<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{adminPass.title_page}">Restablecer Contraseña - Restaurantus</title>
    <link rel="stylesheet" href="/css/userModify.css">
    <link rel="icon" href="/images/favicon.png">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="centered-layout">
    <main class="main-content">
        <div class="form-card animate-fade-in" style="width: 350px;">
            <div class="panel-header">
                <h2 th:text="#{adminPass.h1}">Gestión de Seguridad</h2>
                <p style="margin-bottom: 20px;">
                    <span th:text="#{adminPass.subtitle}">Cambiando contraseña para el usuario:</span>
                    <strong th:text="${user.username}" style="color: #2563eb;"></strong>
                </p>
            </div>

            <form th:action="@{/users/adminUpdatePassword}" method="post" id="passForm">
                <input type="hidden" name="userId" th:value="${user.id}"/>
                
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="password" th:text="#{adminPass.label_new}" style="display: block; margin-bottom: 8px; font-weight: 600;">Nueva contraseña</label>
                    <input type="password" id="newPassword" name="newPassword"
                           th:placeholder="#{adminPass.placeholder}" required>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="passwordConfirm" th:text="#{adminPass.label_confirm}" style="display: block; margin-bottom: 8px; font-weight: 600;">Repetir contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmPassword"
                           th:placeholder="#{adminPass.placeholder_confirm}" required>
                    <span id="matchMessage" style="font-size: 0.85rem; margin-top: 0.5rem; display: block;"></span>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submitBtn" class="change-password" th:text="#{adminPass.btn_save}" disabled>
                        Guardar cambios
                    </button>
                    <a th:href="@{/users/}" class="btn-action btn-outline" th:text="#{adminPass.btn_cancel}">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </main>

    <script th:inline="javascript">
        const password = document.getElementById('newPassword');
        const confirm = document.getElementById('confirmPassword');
        const message = document.getElementById('matchMessage');
        const submitBtn = document.getElementById('submitBtn');

        // Textos desde Thymeleaf para el JS
        // El editor verá un String normal, Thymeleaf lo reemplazará en ejecución
        // (para eliminar la notificacion de un fallo en el visual studio y que no es un fallo realmente)
        const textMatch = /*[[#{adminPass.match_ok}]]*/ "Passwords match";
        const textNoMatch = /*[[#{adminPass.match_error}]]*/ "Passwords do not match";

        function validatePassword() {
            if (confirm.value === "") {
                message.textContent = "";
                submitBtn.disabled = true;
                return;
            }

            if (password.value === confirm.value) {
                message.textContent = textMatch;
                message.style.color = "#16a34a";
                submitBtn.disabled = false;
            } else {
                message.textContent = textNoMatch;
                message.style.color = "#dc2626";
                submitBtn.disabled = true;
            }
        }

        password.addEventListener('input', validatePassword);
        confirm.addEventListener('input', validatePassword);
    </script>
</body>
</html>
