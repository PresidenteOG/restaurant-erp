<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{carta.plato.title_page}">Nuevo Plato - Restaurantus</title>
    <link rel="icon" href="/images/favicon.png">
    <link rel="stylesheet" href="/css/styles.css">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
    <div class="admin-container">
        <main class="main-content" style="max-width: 600px; margin: 0 auto;">
            <div class="panel-header">
                <h1 th:text="${plato.id == null} ? #{carta.plato.h1_new} : #{carta.plato.h1_edit}"></h1>
                <a th:href="@{/carta}" class="edit-link" th:text="'← ' + #{carta.plato.back}">Volver a la carta</a>
            </div>

            <form th:action="@{/carta/plato/guardar}" th:object="${plato}" method="post" enctype="multipart/form-data" class="side-panel" style="display: block; width: 100%;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" th:field="*{id}">
                
                <div class="detail-group">
                    <label class="detail-label" th:text="#{carta.plato.label_name}">Nombre del Plato</label>
                    <input type="text" th:field="*{nombre}" class="detail-value" style="width:100%; border:1px solid #334155; background:transparent; padding:5px;" required>
                </div>

                <div class="detail-group" style="margin-bottom: 20px;">
                    <label class="detail-label" th:text="#{carta.plato.label_image}">Imagen del Plato</label>
                    <div style="display: flex; align-items: center; gap: 15px; margin-top: 10px;">
                        <img id="preview" 
                            th:src="@{/images/plato/{img}(img=${plato.imgUrl != null && plato.imgUrl != '' ? plato.imgUrl : 'default.png'})}" 
                            style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid #334155;">
                        
                        <div style="flex: 1;">
                            <input type="file" name="imageFile" id="imageFile" accept="image/*" 
                                class="detail-value" style="width:100%; border:1px solid #334155; background:transparent; padding:5px;">
                            <p style="font-size: 0.75em; color: #94a3b8; margin-top: 5px;" th:text="#{carta.plato.allowed_formats}">Formatos permitidos: JPG, PNG. Máx 2MB.</p>
                        </div>
                    </div>
                </div>

                <div class="detail-group">
                    <label class="detail-label" th:text="#{carta.plato.label_price}">Precio (€)</label>
                    <input type="number" step="0.001" th:field="*{precio}" class="detail-value" style="width:100%; border:1px solid #334155; background:transparent; padding:5px;" required>
                </div>

                <div class="detail-group">
                    <label class="detail-label" th:text="#{carta.plato.label_cat}">Categoría</label>
                    <select th:field="*{categoria}" id="selectorCategoria" class="detail-value" style="width:100%; border:1px solid #334155; padding:5px; border-radius: 8px;" required>
                        <option value="" disabled selected th:text="#{carta.plato.select_cat}">Seleccione una categoría</option>
                        <option th:each="cat : ${T(cat.copernic.restaurantus_erp.domain.CategoriaPlato).values()}" 
                                th:value="${cat}" 
                                th:text="${cat}">
                        </option>
                    </select>
                </div>

                <div class="detail-group">
                    <label class="detail-label" th:text="#{carta.plato.label_subcat}">Subcategoría</label>
                    <select th:field="*{subcategoria}" id="selectorSubcategoria" class="detail-value" style="width:100%; border:1px solid #334155; background: transparent; padding:5px; border-radius: 8px;" required>
                        <option value="" disabled selected th:text="#{carta.plato.select_subcat}">Seleccione una subcategoría</option>
                        <option th:each="sub : ${T(cat.copernic.restaurantus_erp.domain.SubcategoriaPlato).values()}" 
                                th:value="${sub}" 
                                th:text="${sub.nombreVisible}"
                                th:data-parent="${sub.categoriaPadre}">
                        </option>
                    </select>
                </div>
                <div class="detail-group">
                    <label class="detail-label" th:text="#{carta.plato.label_time}">Tiempo de Preparación (min)</label>
                    <input type="number" th:field="*{tiempoPreparacion}" class="detail-value" style="width:100%; border:1px solid #334155; background:transparent; padding:5px;" required>

                </div>
                <div class="detail-group" style="margin-top: 20px; padding: 15px; border: 1px solid #334155; border-radius: 8px;">
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                        <input type="checkbox" th:field="*{especial}" id="checkEspecial" style="width: 18px; height: 18px; cursor: pointer;">
                        <label for="checkEspecial" class="detail-label" style="margin: 0; cursor: pointer;" th:text="#{carta.plato.label_special}">¿Es un plato especial o temporal?</label>
                    </div>

                    <div id="seccionFechas" th:style="${plato.especial} ? 'display: block;' : 'display: none;'">
                        <div style="display: flex; gap: 15px;">
                            <div style="flex: 1;">
                                <label class="detail-label" th:text="#{carta.plato.beginning_time}">Fecha Inicio Vigencia</label>
                                <input type="date" 
                                    name="inicioVigencia" 
                                    th:value="${plato.inicioVigencia != null ? #temporals.format(plato.inicioVigencia, 'yyyy-MM-dd') : ''}" 
                                    class="detail-value" 
                                    style="width:100%; border:1px solid #334155; background:transparent; padding:5px; color-scheme: dark;">
                            </div>
                            <div style="flex: 1;">
                                <label class="detail-label" th:text="#{carta.plato.end_time}">Fecha Fin Vigencia</label>
                                <input type="date" 
                                    name="finalVigencia" 
                                    th:value="${plato.finalVigencia != null ? #temporals.format(plato.finalVigencia, 'yyyy-MM-dd') : ''}" 
                                    class="detail-value" 
                                    style="width:100%; border:1px solid #334155; background:transparent; padding:5px; color-scheme: dark;">
                            </div>
                        </div>
                        <p style="font-size: 0.8em; color: #94a3b8; margin-top: 10px;" th:text="#{carta.plato.footer_note}">
                            * El plato solo aparecerá en la carta durante este periodo.
                        </p>
                    </div>
                </div>

                <h3 class="detail-label" style="margin-top:20px;" th:text="#{carta.plato.label_ingredients}">Seleccionar Ingredientes</h3>
                <div style="max-height: 200px; overflow-y: auto; margin-bottom: 20px;">
                    <div th:each="ing, iter : ${todosLosIngredientes}" style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
                        <input type="hidden" th:name="|ingredientes[${iter.index}].ingrediente.id|" th:value="${ing.id}">
                        
                        <span th:text="${ing.nombre}" style="width: 150px;"></span>
                        
                        <input type="number" step="0.001" th:name="|ingredientes[${iter.index}].cantidad_necesaria|" 
                            th:value="${plato.obtenerCantidadPorIngrediente(ing.id)}" th:placeholder="#{carta.plato.placeholder_qty}" 
                            style="width: 80px; background: transparent; border: 1px solid #334155; padding: 3px;">
                        <span th:text="${ing.unidadMedida == 'L' ? #messages.msg('inventory.list.unit_l')
                            : ing.unidadMedida == 'KG' ? #messages.msg('inventory.list.unit_kg')
                            : ing.unidadMedida == 'G' ? #messages.msg('inventory.list.unit_g')
                            : #messages.msg('inventory.list.unit_units')}"></span>
                    </div>
                </div>

                <button type="submit" class="btn-action btn-primary" th:text="#{roleName.btn_save}">Guardar</button>
            </form>
        </main>
    </div>

    <script src="/js/platoForm.js"></script>
</body>
</html>
