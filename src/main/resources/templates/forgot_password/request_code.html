<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{forgot_pwd.main.title_page}">Recuperar Contraseña</title>
    <link rel="icon" href="/images/favicon.png">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <div class="auth-card">
        <span class="auth-icon">🔐</span>
        <h1 class="auth-title" th:text="#{forgot_pwd.main.h1}">Recuperar Acceso</h1>
        <p class="auth-subtitle" th:text="#{forgot_pwd.main.subtitle}">Introduce tus datos y te enviaremos un código de seguridad a tu Telegram.</p>

        <div th:if="${error}" class="alert-error">
            <span>⚠️</span> <span th:text="${error}">Error</span>
        </div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="form-group">
                <label class="form-label" th:text="#{forgot_pwd.main.label_user}">Usuario</label>
                <input type="text" name="username" class="form-control" th:placeholder="#{forgot_pwd.main.placeholder_user}" required>
            </div>
            <div class="form-group">
                <label class="form-label" th:text="#{forgot_pwd.main.label_phone}">Teléfono asociado</label>
                <input type="text" name="phoneNumber" class="form-control" th:placeholder="#{forgot_pwd.main.placeholder_phone}" required>
            </div>
            <button type="submit" class="btn-primary" th:text="#{forgot_pwd.main.btn_send}">Enviar Código</button>
        </form>

        <a th:href="@{/login}" class="auth-link">← <span th:text="#{forgot_pwd.main.back_login}">Volver al Login</span></a>
    </div>
</body>
</html>
