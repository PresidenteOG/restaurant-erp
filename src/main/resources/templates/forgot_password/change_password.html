<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{forgot_pwd.reset.title_page}">Nueva Contraseña</title>
    <link rel="icon" href="/images/favicon.png">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <div class="auth-card">
        <span class="auth-icon">🆕</span>
        <h1 class="auth-title" th:text="#{forgot_pwd.reset.h1}">Nueva Contraseña</h1>
        <p class="auth-subtitle" th:text="#{forgot_pwd.reset.subtitle}">Introduce tu nueva contraseña y confírmala para evitar errores.</p>

        <form id="resetForm" th:action="@{/reset-password}" method="post">
            <input type="hidden" name="username" th:value="${username}">
            
            <div class="form-group">
                <label class="form-label" th:text="#{forgot_pwd.reset.label_new}">Nueva Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="pass1" name="newPassword" class="form-control" placeholder="••••••••" required minlength="4">
                    <button type="button" class="btn-eye" onclick="togglePassword('pass1', this)">👁️</button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" th:text="#{forgot_pwd.reset.label_repeat}">Repetir Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="pass2" class="form-control" placeholder="••••••••" required>
                    <button type="button" class="btn-eye" onclick="togglePassword('pass2', this)">👁️</button>
                </div>
                <div id="matchError" class="validation-error">
                    ⚠️ <span th:text="#{forgot_pwd.reset.error_match}">Las contraseñas no coinciden</span>
                </div>
            </div>
            
            <button type="submit" class="btn-primary" th:text="#{forgot_pwd.reset.btn_update}">Actualizar y Entrar</button>
        </form>
    </div>

    <script>
        // 1. Función para mostrar/ocultar contraseña
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.textContent = "🙈"; // Icono de 'ocultar'
            } else {
                input.type = "password";
                btn.textContent = "👁️"; // Icono de 'ver'
            }
        }

        // 2. Validación antes de enviar el formulario
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            const p1 = document.getElementById('pass1').value;
            const p2 = document.getElementById('pass2').value;
            const errorMsg = document.getElementById('matchError');

            if (p1 !== p2) {
                e.preventDefault(); // Detiene el envío
                errorMsg.style.display = "block"; // Muestra el error
                
                // Añadir borde rojo a los inputs para feedback visual
                document.getElementById('pass2').style.borderColor = "#ef4444";
            } else {
                errorMsg.style.display = "none";
                // Permitimos que el formulario se envíe
            }
        });

        // 3. Limpiar error cuando el usuario escribe de nuevo
        document.getElementById('pass2').addEventListener('input', function() {
            document.getElementById('matchError').style.display = "none";
            this.style.borderColor = "#e2e8f0"; // Vuelve al color original
        });
    </script>
</body>
</html>
