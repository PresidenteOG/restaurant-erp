<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{finanzas.cobro.title_page}">Pasarela de Cobro - Restaurantus</title>
    <link rel="stylesheet" href="/css/styles.css">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>

<body>
<div class="admin-container">
    <main class="main-content" style="max-width: 700px; margin: 0 auto;">

        <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1 th:text="#{finanzas.cobro.title}">Finalizar y Cobrar</h1>
                <p th:text="${#messages.msg('finanzas.cobro.comanda') + ' #' + pedido.id + ' - ' + #messages.msg('finanzas.cobro.mesa') + ' ' + pedido.mesa.numMesa}"></p>
            </div>
        </div>
        <div style="margin-bottom: 20px;">
            <a th:href="@{/finanzas/descargarFactura/{id}(id=${pedido.id})}" target="_blank"
            class="btn-action" style="background: #64748b; text-decoration: none; color: white; padding: 10px 15px; border-radius: 8px;"
            th:text="'📄 ' + #{finanzas.cobro.ver_factura}">📄 Ver Factura PDF</a>
            <a th:href="@{/finanzas/pendientesCobro}" class="btn-action" 
            style="background: #64748b; text-decoration: none; color: white; padding: 10px 15px; border-radius: 8px; margin-left: 10px;"
            th:text="'← ' + #{finanzas.cobro.volver}">← Volver a Pendientes de Cobro</a>
        </div>

        <div class="order-card" style="box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); border-radius: 16px; overflow: hidden; background: white;">
            
            <div style="padding: 30px;">
                <h4 style="margin-bottom: 20px; color: #1e293b; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px;"
                th:text="#{finanzas.cobro.resumen}">Resumen de Cuenta</h4>

                <div th:each="linea : ${pedido.detallesPlatos}" th:if="${!linea.esMenu}" 
                     style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed #e2e8f0;">
                    <div>
                        <span style="font-weight: 600; color: #0f172a;" th:text="${linea.cantidad + 'x '}"></span>
                        <span th:text="${linea.plato.nombre}"></span>
                    </div>
                    <span style="font-weight: 500;" th:text="${#numbers.formatDecimal(linea.plato.precio * linea.cantidad, 1, 2) + '€'}"></span>
                </div>

                <div th:each="menu : ${pedido.detallesMenus}" 
                     style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed #e2e8f0; background: #f8fafc; margin: 0 -30px; padding: 12px 30px;">
                    <div>
                        <span style="font-weight: 600; color: #0f172a;" th:text="${menu.cantidad + 'x '}"></span>
                        <span th:text="${#messages.msg('pedido.detalle.badge_menu') + ': ' + menu.menu.nombre}"></span>
                    </div>
                    <span style="font-weight: 600;" th:text="${#numbers.formatDecimal(menu.menu.precio * menu.cantidad, 1, 2) + '€'}"></span>
                </div>

                <div style="margin-top: 30px; background: #f1f5f9; padding: 20px; border-radius: 12px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px; color: #475569;">
                        <span th:text="#{finanzas.cobro.no_vat}">Base Imponible (Sin IVA)</span>
                        <span th:text="${#numbers.formatDecimal(totalCalculado - (totalCalculado * (iva / 100)), 1, 2) + '€'}"></span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 12px; color: #475569; font-size: 0.9rem;">
                        <span th:text="#{finanzas.cobro.vat(${iva})}">IVA (10%)</span>
                        <span th:text="${#numbers.formatDecimal(totalCalculado * (iva / 100), 1, 2) + '€'}"></span>
                    </div>
                    <div style="display: flex; justify-content: space-between; border-top: 2px solid #cbd5e1; padding-top: 10px; margin-top: 10px;">
                        <span style="font-size: 1.3rem; font-weight: 800; color: #1e293b;" th:text="#{finanzas.cobro.total}">TOTAL A COBRAR</span>
                        <span id="totalComanda" style="font-size: 1.3rem; font-weight: 800; color: #059669;" 
                              th:attr="data-total=${totalCalculado}"
                              th:text="${#numbers.formatDecimal(totalCalculado, 1, 2) + '€'}"></span>
                    </div>
                </div>
            </div>

            <form id="formCobro" th:action="@{/finanzas/cobrar/{id}(id=${pedido.id})}" method="post">
                <input type="hidden" name="metodo" id="metodoPago" value="">
                <input type="hidden" name="cambio" id="inputCambioOculto" value="0.00">

                <div style="background: #1e293b; padding: 30px; text-align: center;">
                    
                    <div style="margin-bottom: 25px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 12px; border: 1px dashed #475569;">
                        <div style="display: flex; align-items: center; justify-content: center; gap: 20px;">
                            <div>
                                <label style="color: #94a3b8; display: block; font-size: 0.8rem; margin-bottom: 5px;">PAGO CON</label>
                                <input type="number" id="inputEntregado" step="0.01" placeholder="0.00" 
                                    style="background: #0f172a; border: 1px solid #334155; color: #10b981; padding: 10px; border-radius: 8px; font-size: 1.2rem; width: 120px; text-align: center;">
                            </div>
                            <div style="text-align: center;">
                                <label style="color: #94a3b8; display: block; font-size: 0.8rem; margin-bottom: 5px;">CAMBIO</label>
                                <div id="textoCambio" style="font-size: 1.5rem; font-weight: 800; color: #f59e0b;">0,00€</div>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 15px; justify-content: center;">
                        <button type="button" id="btnEfectivo" onclick="enviarFormulario('EFECTIVO')"
                                style="flex: 1; background: #10b981; color: white; padding: 15px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer;"
                                th:text="'💵 ' + #{finanzas.cobro.efectivo}">💵 EFECTIVO
                        </button>

                        <button type="button" id="btnTarjeta" onclick="enviarFormulario('TARJETA')"
                                style="flex: 1; background: #3b82f6; color: white; padding: 15px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer;"
                                th:text="'💳 ' + #{finanzas.cobro.tarjeta}">💳 TARJETA
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <script th:src="@{/js/calculoCambio.js}" defer></script>
    <script>
        function enviarFormulario(metodo) {
            const mensajeConfirmacion = "¿Confirmar cobro?"; // Simplificado para el ejemplo

            if (confirm(mensajeConfirmacion)) {
                const form = document.getElementById('formCobro');
                document.getElementById('metodoPago').value = metodo;
                
                // 1. Enviamos el PDF a una pestaña nueva para que no bloquee la actual
                form.target = '_blank';
                form.submit();

                // 2. Redirigimos la pestaña principal inmediatamente a la lista
                window.location.href = "/finanzas/pendientesCobro";
            }
        }
    </script>
</div>
</body>
</html>
