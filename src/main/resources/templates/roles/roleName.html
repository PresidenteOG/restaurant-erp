<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{roleName.title_page}">Nombrar Rol - Restaurantus</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/userModify.css">
    <link rel="icon" href="/images/favicon.png">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="centered-layout">
    <main class="main-content">
        <div class="form-card animate-fade-in">
            <div class="panel-header">
                <h1 th:text="#{roleName.h1}">Nombrar Rol</h1>
                <p th:text="#{roleName.subtitle}">Asigna un nombre descriptivo para este rol en el sistema.</p>
            </div>

            <div th:if="${error}" class="alert-error" style="background-color: #fee2e2; color: #b91c1c; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; border: 1px solid #fecaca;">
                <span th:text="${error}"></span>
            </div>

            <form th:object="${role}" th:action="@{/roles/updateRole}" method="post">
                <input type="hidden" th:field="*{id}"/>
                
                <div class="form-group">
                    <label for="name" th:text="#{roleName.label_name}">Nombre del Rol</label>
                    <input type="text" id="name" th:field="*{name}" 
                           th:placeholder="#{roleName.placeholder_name}" required>
                </div>

                <div class="form-actions" style="margin-top: 2rem;">
                    <button type="submit" class="btn-action btn-primary" th:text="#{roleName.btn_save}">
                        Guardar
                    </button>
                    <a th:href="@{/roles}" class="btn-action btn-outline" th:text="#{roleName.btn_cancel}">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
