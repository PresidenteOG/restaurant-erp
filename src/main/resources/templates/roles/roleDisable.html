<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{roleDisable.title_page}">Desactivar Rol - Restaurantus</title>
    <link rel="stylesheet" href="/css/userModify.css">
    <link rel="icon" href="/images/favicon.png">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="centered-layout">
    <main class="main-content">
        <div class="form-card alert-card animate-fade-in" style="text-align: center; max-width: 500px;">
            <div class="status-icon-warning" style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
            
            <h2 th:text="#{roleDisable.h2}">¿Estás seguro de que quieres desactivar este rol?</h2>
            
            <div class="info-box" style="margin: 1.5rem 0; text-align: left;">
                <p th:text="#{roleDisable.info_main}">El rol seguirá existiendo y los usuarios que lo tengan lo mantendrán, pero no será visible en ninguna parte.</p>
                <p style="font-weight: 600; margin-top: 0.5rem;" th:text="#{roleDisable.info_revert}">Esta acción puede revertirse más adelante.</p>
            </div>

            <div class="form-actions" style="justify-content: center; gap: 1rem;">
                <a th:href="@{'/roles/disableRoleOk-' + ${role.id}}" class="btn-action btn-danger" 
                   style="background-color: #dc3545; color: white;" th:text="#{roleDisable.btn_confirm}">
                    Desactivar
                </a>
                <a th:href="@{/roles}" class="btn-action btn-outline" th:text="#{roleDisable.btn_cancel}">
                    Cancelar
                </a>
            </div>
        </div>
    </main>
</body>
</html>
