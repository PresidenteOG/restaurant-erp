<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{logs.title_page}">Intentos de Acceso - Restaurantus</title>
    <link rel="icon" href="/images/favicon.png">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/user_and_roles_lists.css">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
    <div th:replace="~{/page_dashboard/dashboard :: sidebar(activePage='rolesAndUsers')}"></div>

    <div class="admin-container">
        <main class="main-content with-dashboard">
            <div class="panel-header">
                <h1 th:text="#{logs.title}">Registro de Intentos de Acceso</h1>
                <p th:text="#{logs.subtitle}">Aquí aparecen todos los intentos de acceso al sistema.</p>
            </div>

            <div class="nav-tabs" style="--bs-nav-tabs-border-color: #ffffff00;">
                <a th:text="#{manageUsers.tab_users}" th:href="@{/users/}" class="tab-btn">Usuarios</a>
                <a th:text="#{manageUsers.tab_roles}" th:href="@{/roles}" class="tab-btn">Roles</a>
                <a th:text="#{manageUsers.tab_logins}" class="tab-btn active">Intentos de Login</a>
            </div>

            <div style="background-color: white; padding: 20px; border-radius: 8px; margin-top: 20px;">
                <table id="tablaAttempts" class="data-table">
                    <thead>
                        <tr>
                            <th th:text="#{logs.th_user}">Usuario</th>
                            <th th:text="#{logs.th_date}">Fecha</th>
                            <th th:text="#{logs.th_ip}">IP</th>
                            <th th:text="#{logs.th_status}">Estado</th>
                        </tr>
                        <tr class="filter-row">
                            <th><input type="text" th:placeholder="#{logs.th_user} + '...'"></th>
                            <th><input type="text" th:placeholder="#{logs.th_date} + '...'"></th>
                            <th><input type="text" th:placeholder="#{logs.th_ip} + '...'"></th>
                            <th>
                                <select class="select-filter">
                                    <option value="" th:text="#{crudCommons.all}">Todos</option>
                                    <option th:value="#{logs.status_ok}" th:text="#{logs.status_ok}">Éxito</option>
                                    <option th:value="#{logs.status_fail}" th:text="#{logs.status_fail}">Fallido</option>
                                </select>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="log : ${attempts}">
                            <td th:text="${log.username}"></td>
                            <td th:text="${#temporals.format(log.timestamp, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${log.ipAddress}"></td>
                            <td>
                                <span th:class="${log.success ? 'status-pill status-active' : 'status-pill status-inactive'}"
                                    th:text="${log.success ? #messages.msg('logs.status_ok') : #messages.msg('logs.status_fail')}">
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script th:inline="javascript">
        window.datatableTranslations = {
            search: "",
            searchPlaceholder: /*[[#{crudCommons.search}]]*/ "Buscar",
            lengthMenu: /*[[#{crudCommons.lengthMenu}]]*/ "Mostrar _MENU_ registros",
            infoFiltered: "",
            info: /*[[#{crudCommons.info}]]*/ "Mostrando _START_ a _END_ de <b>_TOTAL_</b> registros",
            infoEmpty: /*[[#{crudCommons.infoEmpty}]]*/ "Mostrando 0 a 0 de 0 registros",
            paginate: {
                next: /*[[#{crudCommons.next}]]*/ "Siguiente",
                previous: /*[[#{crudCommons.previous}]]*/ "Anterior",
                first: /*[[#{crudCommons.first}]]*/ "Primero",
                last: /*[[#{crudCommons.last}]]*/ "Último"
            }
        };
    </script>
</body>
</html>
