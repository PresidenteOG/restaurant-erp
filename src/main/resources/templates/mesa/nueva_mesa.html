<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{mesa.new.title_page} + ' - ' + ${appName}">Nueva Mesa</title>
    <link rel="icon" th:href="@{${faviconPath}}">
    <style>
        /* Tus estilos se mantienen idénticos */
        .form-container { background-color: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); max-width: 900px; margin: 20px 0; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #334155; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; }
        .form-row { display: flex; gap: 20px; }
        .flex-1 { flex: 1; }
        .btn-group { display: flex; justify-content: flex-end; gap: 12px; margin-top: 30px; padding-top: 20px; border-top: 1px solid #f1f5f9; }
        .btn-save { background-color: #2ecc71; color: white; padding: 12px 30px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
        .alert-custom { padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; font-weight: 600; }
        .alert-error { background-color: #fee2e2; border-left: 5px solid #ef4444; color: #991b1b; }
        .form-control::placeholder { color: #0ffc03; opacity: 1; font-weight: 400; font-style: italic; }
        .btn-add-small { background-color: #f1f5f9; color: #2ecc71; border: 1px solid #2ecc71; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 4px; }
        .btn-add-small:hover { background-color: #2ecc71; color: white; transform: translateY(-1px); box-shadow: 0 2px 5px rgba(46, 204, 113, 0.2); }
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.4); backdrop-filter: blur(2px); }
        .modal-content { background-color: white; margin: 10% auto; padding: 30px; border-radius: 15px; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2); border: none; position: relative; }
    </style>
</head>

<body>
    <div th:replace="~{/page_dashboard/dashboard :: sidebar(activePage='tables')}"></div>

    <div class="admin-container">
        <main class="main-content with-dashboard">

            <div class="panel-header">
                <h1>
                    <i class="bi bi-plus-circle" style="color: #2ecc71; margin-right: 12px;"></i>
                    <span th:text="#{mesa.new.h1}">Registrar Nueva Mesa</span>
                </h1>
                <p th:text="#{mesa.new.subtitle}">Configura una nueva mesa física para el restaurante.</p>
            </div>

            <div th:if="${error}" class="alert-custom alert-error msg-alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${error}"></span>
            </div>

            <div class="form-container">
                <form th:action="@{/mesas/guardar}" th:object="${mesa}" method="post">
                    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label for="numMesa">
                                <i class="bi bi-hash"></i>
                                <span th:text="#{mesa.new.label.id}">Número / Identificador</span>
                                <span style="color: rgb(230, 0, 0)">*</span>
                            </label>
                            <input type="text" id="numMesa" th:field="*{numMesa}" class="form-control"
                                th:placeholder="#{mesa.new.placeholder.id}" required>
                        </div>
                        <div class="form-group flex-1">
                            <label for="capacidad">
                                <i class="bi bi-people"></i>
                                <span th:text="#{mesa.new.label.capacity}">Capacidad</span>
                                <span style="color: rgb(230, 0, 0)">*</span>
                            </label>
                            <input type="number" id="capacidad" th:field="*{capacidad}" class="form-control"
                                th:placeholder="#{mesa.new.placeholder.capacity}" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group flex-1">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                <label for="ubicacion" style="margin-bottom: 0;">
                                    <i class="bi bi-geo-alt"></i> <span th:text="#{mesa.new.label.location}">Ubicación</span>
                                </label>
                                <button type="button" onclick="openModal()" class="btn-add-small">
                                    <i class="bi bi-plus"></i> <span th:text="#{mesa.new.btn.new_zone}">Nueva Zona</span>
                                </button>
                            </div>
                            <select id="ubicacion" th:field="*{ubicacion}" class="form-control">
                                <option th:each="nombre : ${listaUbicaciones}" th:value="${nombre}" th:text="${nombre}">
                                </option>
                            </select>
                        </div>
                        <div class="form-group flex-1">
                            <label for="estado"><i class="bi bi-info-circle"></i> <span th:text="#{mesa.new.label.status}">Estado Inicial</span></label>
                            <select id="estado" th:field="*{estado}" class="form-control" disabled>
                                <option value="available" th:text="#{mesa.status.available}">Disponible</option>
                            </select>
                        </div>
                    </div>

                    <div class="btn-group">
                        <a th:href="@{/mesas/listar}" th:text="#{crudCommons.cancel}"
                            style="text-decoration: none; padding: 12px 25px; color: #64748b;">Cancelar</a>
                        <button type="submit" class="btn-save">
                            <i class="bi bi-save"></i> <span th:text="#{mesa.new.btn.save}">Guardar Mesa</span>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <div id="modalUbicacion" class="modal">
        <div class="modal-content">
            <h3 style="margin-top: 0; color: #334155;" th:text="#{mesa.new.modal.title}">Nueva Ubicación</h3>
            <p style="font-size: 14px; color: #64748b;" th:text="#{mesa.new.modal.subtitle}">Escribe el nombre de la nueva zona:</p>
            <input type="text" id="nuevoNombreUbicacion" class="form-control" th:placeholder="#{mesa.new.modal.placeholder}"
                style="text-align: center; text-transform: uppercase;">

            <div class="btn-group" style="margin-top: 20px; padding-top: 15px;">
                <button type="button" onclick="closeModal()" th:text="#{crudCommons.cancel}"
                    style="background: none; border: none; color: #94a3b8; cursor: pointer;">Cancelar</button>
                <button type="button" onclick="addUbicacionLista()" class="btn-save"
                    style="padding: 8px 20px;" th:text="#{mesa.new.modal.btn.add}">Añadir</button>
            </div>
        </div>
    </div>

    <script>
        window.onload = function () {
            const alerts = document.querySelectorAll('.msg-alert');
            alerts.forEach(alertElement => {
                setTimeout(() => {
                    alertElement.style.transition = "opacity 0.4s ease";
                    alertElement.style.opacity = "0";
                    setTimeout(() => alertElement.remove(), 600);
                }, 5000);
            });
        };

        function openModal() {
            document.getElementById('modalUbicacion').style.display = 'block';
            document.getElementById('nuevoNombreUbicacion').focus();
        }

        function closeModal() {
            document.getElementById('modalUbicacion').style.display = 'none';
        }

        function addUbicacionLista() {
            const input = document.getElementById('nuevoNombreUbicacion');
            const select = document.getElementById('ubicacion');
            const nombre = input.value.trim().toUpperCase();

            if (nombre === "") {
                alert("Por favor, escribe un nombre para la ubicación.");
                return;
            }

            const csrfToken = document.querySelector('input[name="_csrf"]')?.value;

            fetch('/mesas/ubicaciones/guardar-ajax', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRF-TOKEN': csrfToken
                },
                body: 'nombre=' + encodeURIComponent(nombre)
            })
            .then(response => {
                if (response.ok) {
                    const option = document.createElement("option");
                    option.value = nombre;
                    option.text = nombre;
                    option.selected = true;
                    select.add(option);
                    input.value = "";
                    closeModal();
                } else {
                    alert("Error al guardar en la base de datos.");
                }
            })
            .catch(error => {
                console.error('Error en la petición:', error);
            });
        }

        window.onclick = function (event) {
            const modal = document.getElementById('modalUbicacion');
            if (event.target == modal) closeModal();
        }
    </script>
</body>
</html>
