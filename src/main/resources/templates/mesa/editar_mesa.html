<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="#{mesa.edit.title_page}">Editar Mesa - Restaurantus</title>
    <link rel="icon" href="/images/favicon.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <style>
        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 900px;
            margin: 20px 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
            font-size: 0.95rem;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: #2ecc71;
            box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.1);
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .flex-2 {
            flex: 2;
        }

        .flex-1 {
            flex: 1;
        }

        .btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
        }

        .btn-update {
            background-color: #2ecc71;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-update:hover {
            background-color: #27ae60;
            transform: translateY(-1px);
        }

        .btn-cancel {
            background-color: #f8fafc;
            color: #64748b;
            padding: 12px 25px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-cancel:hover {
            background-color: #f1f5f9;
            color: #334155;
        }

        /* Estilos para las alertas */
        .alert-custom {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            max-width: 900px;
            animation: fadeIn 0.5s ease;
        }

        .alert-success {
            background-color: #ecfdf5;
            border-left: 5px solid #10b981;
            color: #065f46;
        }

        .alert-error {
            background-color: #fee2e2;
            border-left: 5px solid #ef4444;
            color: #991b1b;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div th:replace="~{page_dashboard/dashboard :: sidebar(activePage='tables')}"></div>

    <div class="admin-container">
        <main class="main-content with-dashboard">
            <div class="panel-header">
                <h1>
                    <i class="bi bi-grid-3x3-gap" style="color: #2ecc71; margin-right: 12px">
                    </i><span th:text="#{mesa.edit.title}">Editar Mesa</span>
                </h1>
                <p th:text="#{mesa.edit.subtitle}">Modifica la configuración de la mesa física. Los cambios afectarán a la disponibilidad en el motor de reservas.</p>
            </div>

            <div th:if="${success}" class="alert-custom alert-success msg-alert">
                <i class="bi bi-check-circle-fill" style="font-size: 1.2rem"></i>
                <span th:text="${success}"></span>
            </div>

            <div th:if="${error}" class="alert-custom alert-error msg-alert">
                <i class="bi bi-exclamation-triangle-fill" style="font-size: 1.2rem"></i>
                <span th:text="${error}"></span>
            </div>

            <div class="form-container">
                <form th:action="@{/mesas/actualizar}" th:object="${mesa}" method="post">
                    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <input type="hidden" th:field="*{idMesa}" />

                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label for="numMesa">
                                <i class="bi bi-hash"></i>
                                <span th:text="#{mesa.new.label.id}">Número / Identificador</span>
                                <span style="color: rgb(230, 0, 0)">*</span>
                            </label>
                            <input type="text" id="numMesa" th:field="*{numMesa}" class="form-control"
                                th:placeholder="#{mesa.new.placeholder.id}" required>
                          </div>

                          <div class="form-group flex-1">
                            <label for="capacidad">
                                <i class="bi bi-people"></i>
                                <span th:text="#{mesa.new.label.capacity}">Capacidad</span>
                            </label>
                            <input type="number" id="capacidad" th:field="*{capacidad}" class="form-control" min="1" max="20" readonly
                              style="background-color: #f8fafc; cursor: not-allowed" />
                        </div>
                    </div>

                  <div class="form-row">
                      <div class="form-group flex-1">
                          <label for="ubicacion">
                              <i class="bi bi-geo-alt"></i> <span th:text="#{mesa.new.label.location}">Ubicación</span>
                          </label>
                          <select id="ubicacion" th:field="*{ubicacion}" class="form-control" required>
                              <option th:each="loc : ${listaUbicaciones}" th:value="${loc}" th:text="${loc}"></option>
                          </select>
                      </div>

                      <div class="form-group flex-1">
                          <label for="estado"><i class="bi bi-info-circle"></i> <span th:text="#{crudCommons.status}">Estado</span></label>
                          <select id="estado" th:field="*{estado}" class="form-control">
                              <option value="available" th:text="#{mesa.status.available}">Disponible</option>
                              <option value="unavailable" th:text="#{mesa.status.unavailable}">No Disponible</option>
                              <option value="out_of_service" th:text="#{mesa.status.out_of_service}">Fuera de Servicio</option>
                          </select>
                      </div>
                  </div>

                    <div class="btn-group">
                        <a th:href="@{/mesas/listar}" class="btn-cancel"
                        th:text="#{reserva.edit.back}">Volver al listado
                        </a>
                        <button type="submit" class="btn-update">
                            <i class="bi bi-save"></i> <span th:text="#{userUpdate.btn_save}">Guardar Cambios</span>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        window.onload = function () {
            // Seleccionamos las alertas por clase para asegurar que el script funcione correctamente
            const alerts = document.querySelectorAll(".msg-alert");
            alerts.forEach((alertElement) => {
                setTimeout(() => {
                    alertElement.style.transition = "opacity 0.8s ease";
                    alertElement.style.opacity = "0";
                    setTimeout(() => alertElement.remove(), 400);
                }, 8000);
            });
        };
    </script>
</body>

</html>
